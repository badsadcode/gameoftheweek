# Builds every game in games/*/ and deploys the GitHub Pages site.
# A game folder needs game.json. engine "love" -> tools/build-love.sh; anything else -> its own build.sh <out-dir>.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  LOVE_VERSION: "11.5"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download LÖVE for Windows
        run: |
          curl -sSL -o love.zip "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-win64.zip"
          unzip -q love.zip

      - name: Build every game
        env:
          WEB: "1"
        run: |
          export LOVE_WIN="$PWD/love-${LOVE_VERSION}-win64"
          for dir in games/*/; do
            slug="$(basename "$dir")"
            engine="$(jq -r '.engine // empty' "$dir/game.json")"
            echo "::group::$slug ($engine)"
            if [ "$engine" = "love" ]; then
              bash tools/build-love.sh "$dir" "dist/$slug"
            elif [ -f "$dir/build.sh" ]; then
              bash "$dir/build.sh" "dist/$slug"
            else
              echo "no build for $slug"
            fi
            echo "::endgroup::"
          done

      - name: Assemble site
        run: bash tools/assemble-site.sh dist _site && ls -R _site | head -60

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
