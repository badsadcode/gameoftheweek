# Builds every game in games/*/ and deploys the GitHub Pages site.
# Any engine, any genre: each game folder builds via LÖVE helper, its own build.sh, or a prebuilt/ folder.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  LOVE_VERSION: "11.5"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Godot + export templates
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-4.4.1-v1

      - name: Download LÖVE for Windows
        run: |
          curl -sSL -o love.zip "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-win64.zip"
          unzip -q love.zip

      - name: Build every game (any engine, see tools/build-all.sh)
        env:
          WEB: "1"
        run: LOVE_WIN="$PWD/love-${LOVE_VERSION}-win64" bash tools/build-all.sh dist

      - name: Assemble site
        run: bash tools/assemble-site.sh dist _site && ls -R _site | head -60

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
